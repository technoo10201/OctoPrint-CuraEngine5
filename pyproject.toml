[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-CuraEngine5"
version = "0.1.2"
description = "OctoPrint slicer plugin for CuraEngine 5.x (unofficial)"
authors = [
    {name = "technoo10201"}
]
readme = {file = "README.md", content-type = "text/markdown"}
dynamic = [
    "license"
]

requires-python = ">=3.9, <4"

# any additional requirements (besides OctoPrint) should be listed here
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_curaengine5",
    "octoprint_curaengine5.*"
]

[project.entry-points."octoprint.plugin"]
curaengine5 = "octoprint_curaengine5"

[project.urls]
Homepage = "https://github.com/technoo10201/OctoPrint-CuraEngine5"

[project.optional-dependencies]
develop = [
    "pytest"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
