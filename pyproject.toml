[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-CuraEngine5"
version = "0.1.0"
description = "OctoPrint slicer plugin for CuraEngine 5.x (unofficial)"
readme = "README.md"
authors = [{ name = "technoo10201" }]
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.9, <4"
dependencies = []
classifiers = [
    "Framework :: OctoPrint",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Natural Language :: English",
]

[project.entry-points."octoprint.plugin"]
curaengine5 = "octoprint_curaengine5"

[project.optional-dependencies]
develop = ["pytest"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["octoprint_curaengine5", "octoprint_curaengine5.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
